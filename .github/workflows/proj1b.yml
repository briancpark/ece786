name: Proj1B

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Schedule to run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'

jobs:
  build-and-run:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and run vectorAdd in GPGPU-Sim
      run: |
        docker run --rm \
          -v $GITHUB_WORKSPACE:/workspace \
          --user root \
          pli11/gpgpusim:cuda_10_1 \
          bash -c '
            export CUDA_INSTALL_PATH=/usr/local/cuda-10.1
            export PATH=$CUDA_INSTALL_PATH/bin:$PATH

            cd /root/gpgpu-sim_distribution
            git checkout tags/v4.0.1 -b v401
            make clean
            source setup_environment
            make -j

            cd /root
            git clone https://github.com/peiyi1/vectorAdd.git
            cd vectorAdd/
            make -j

            cp /root/gpgpu-sim_distribution/configs/tested-cfgs/SM7_QV100/* .
            ./vectorAdd > output.txt
            cat output.txt
            cp output.txt /workspace/vectorAdd-output.txt
          '

    - name: Upload output
      uses: actions/upload-artifact@v4
      with:
        name: vectorAdd-output
        path: vectorAdd-output.txt
